name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: Swatinem/rust-cache@v2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - name: Install Linux system deps
        run: bash scripts/ci-linux-deps.sh
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-linux.sh
          TARBALL="target/package/pimon-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          test -f "$TARBALL"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "asset=$(basename "$TARBALL")" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: ${{ steps.pkg.outputs.tarball }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt && cat checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true